<button class="theme-toggle" type="button" id="theme-toggle"
        aria-label="Switch between dark and light theme" title="Switch theme">
  <span class="theme-toggle__sun" aria-hidden="true"><i class="fas fa-sun"></i></span>
  <span class="theme-toggle__moon" aria-hidden="true"><i class="fas fa-moon"></i></span>
</button>

<script>
  (function () {
    /* Theme toggle. No stored value means dark, the default in _sass/_theme.scss. */
    var btn = document.getElementById('theme-toggle');
    if (btn) {
      btn.addEventListener('click', function () {
        var root = document.documentElement;
        var next = root.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
        root.setAttribute('data-theme', next);
        try { window.localStorage.setItem('theme', next); } catch (e) {}
      });
    }

    /* Open a collapsed <details> when it is the target of an anchor, so the
       links in the "At a glance" lists reveal the entry they point at. */
    function openTarget() {
      if (!window.location.hash) return;
      var el;
      try { el = document.getElementById(decodeURIComponent(window.location.hash.slice(1))); }
      catch (e) { return; }
      if (!el) return;
      var d = el.tagName === 'DETAILS' ? el : el.closest('details');
      if (d) {
        d.open = true;
        el.scrollIntoView();
      }
    }
    window.addEventListener('hashchange', openTarget);
    openTarget();

    /* Citation panels: toggle, and copy the block to the clipboard. */
    document.addEventListener('click', function (ev) {
      var cite = ev.target.closest('.cite-btn');
      if (cite) {
        var panel = document.getElementById(cite.getAttribute('aria-controls'));
        if (!panel) return;
        var open = panel.hasAttribute('hidden');
        if (open) { panel.removeAttribute('hidden'); } else { panel.setAttribute('hidden', ''); }
        cite.setAttribute('aria-expanded', open ? 'true' : 'false');
        return;
      }
      var copy = ev.target.closest('.copy-btn');
      if (copy) {
        var block = copy.closest('.cite-block');
        var src = block && block.querySelector('.cite-src');
        if (!src) return;
        var done = function () {
          var was = copy.textContent;
          copy.textContent = 'Copied';
          setTimeout(function () { copy.textContent = was; }, 1400);
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(src.textContent).then(done, function () {});
        } else {
          /* Older browsers, and any page not served over https. */
          var r = document.createRange();
          r.selectNodeContents(src);
          var sel = window.getSelection();
          sel.removeAllRanges(); sel.addRange(r);
          try { document.execCommand('copy'); done(); } catch (e) {}
          sel.removeAllRanges();
        }
      }
    });
  })();
</script>
